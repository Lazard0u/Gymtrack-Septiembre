services:

  # ── Base de datos MySQL ─────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: gymtrack_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-gymtrack}
      MYSQL_USER: ${DB_USERNAME:-gymtrack_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gymtrack_pass}
    ports:
      - "3306:3306"
    volumes:
      - ./database/gymtrack_database.sql:/docker-entrypoint-initdb.d/gymtrack_database.sql
      - db_data:/var/lib/mysql
    networks:
      - gymtrack_net

  # ── Backend PHP / Apache ────────────────────────────────────
  # Usamos dockerfile_inline para instalar la extensión PDO MySQL
  # que la imagen base php:8.2-apache no incluye por defecto.
  backend:
    build:
      context: .
      dockerfile_inline: |
        FROM php:8.2-apache
        RUN docker-php-ext-install pdo_mysql \
            && a2enmod rewrite
        RUN echo 'ServerName localhost' >> /etc/apache2/apache2.conf
    container_name: gymtrack_backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-gymtrack}
      DB_USERNAME: ${DB_USERNAME:-gymtrack_user}
      DB_PASSWORD: ${DB_PASSWORD:-gymtrack_pass}
      SESSION_NAME: ${SESSION_NAME:-gymtrack_session}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
    networks:
      - gymtrack_net

  # ── Frontend Vue 3 / Vite ───────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: gymtrack_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - gymtrack_net

volumes:
  db_data:
  frontend_node_modules:

networks:
  gymtrack_net:
    driver: bridge
