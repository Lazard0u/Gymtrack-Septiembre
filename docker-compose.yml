services:

  # ── Base de datos MySQL ─────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: gymtrack_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-gymtrack}
      MYSQL_USER: ${DB_USERNAME:-gymtrack_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gymtrack_pass}
    ports:
      - "3306:3306"
    volumes:
      - ./database/gymtrack_database.sql:/docker-entrypoint-initdb.d/000_bootstrap.sql:ro
      - ./database/migrations/001_phase1_integrity.sql:/docker-entrypoint-initdb.d/001_phase1_integrity.sql:ro
      - ./database/migrations/002_phase3_roles_demo_context.sql:/docker-entrypoint-initdb.d/002_phase3_roles_demo_context.sql:ro
      - ./database/migrations/003_phase3_identity_security.sql:/docker-entrypoint-initdb.d/003_phase3_identity_security.sql:ro
      - ./database/migrations/004_phase4_administration.sql:/docker-entrypoint-initdb.d/004_phase4_administration.sql:ro
      - ./database/migrations/005_phase5_tenant_operations.sql:/docker-entrypoint-initdb.d/005_phase5_tenant_operations.sql:ro
      - ./database/migrations/006_class_schedule_booking_attendance.sql:/docker-entrypoint-initdb.d/006_class_schedule_booking_attendance.sql:ro
      - ./database/migrations/007_payments_finance_reports.sql:/docker-entrypoint-initdb.d/007_payments_finance_reports.sql:ro
      - db_data:/var/lib/mysql
    networks:
      - gymtrack_net

  # ── Backend PHP / Apache ────────────────────────────────────
  # Usamos dockerfile_inline para instalar la extensión PDO MySQL
  # que la imagen base php:8.2-apache no incluye por defecto.
  backend:
    build:
      context: .
      dockerfile_inline: |
        FROM php:8.2-apache
        RUN docker-php-ext-install pdo_mysql \
            && a2enmod rewrite
        RUN echo 'ServerName localhost' >> /etc/apache2/apache2.conf
    container_name: gymtrack_backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_KEY: ${APP_KEY:-gymtrack-local-development-key-not-for-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-gymtrack}
      DB_USERNAME: ${DB_USERNAME:-gymtrack_user}
      DB_PASSWORD: ${DB_PASSWORD:-gymtrack_pass}
      SESSION_NAME: ${SESSION_NAME:-gymtrack_session}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      SESSION_PATH: ${SESSION_PATH:-/}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-1800}
      SESSION_ABSOLUTE_SECONDS: ${SESSION_ABSOLUTE_SECONDS:-28800}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
      MAIL_FROM: ${MAIL_FROM:-no-reply@gymtrack.local}
      MAIL_LOG_PATH: ${MAIL_LOG_PATH:-/tmp/gymtrack-mail/mail.log}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mercado_pago}
      PAYMENT_MODE: ${PAYMENT_MODE:-test}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      UPLOAD_STORAGE_PATH: ${UPLOAD_STORAGE_PATH:-/var/lib/gymtrack/uploads}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DEMO_DATASET_NAME: ${DEMO_DATASET_NAME:-gymtrack-presentation}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      ALLOW_DEMO_DATA_IN_PRODUCTION: ${ALLOW_DEMO_DATA_IN_PRODUCTION:-false}
      FEATURE_WHATSAPP: ${FEATURE_WHATSAPP:-false}
      FEATURE_GOOGLE_CALENDAR_SYNC: ${FEATURE_GOOGLE_CALENDAR_SYNC:-false}
      FEATURE_ADVANCED_ANALYTICS: ${FEATURE_ADVANCED_ANALYTICS:-false}
      FEATURE_PERSONAL_RECOMMENDATIONS: ${FEATURE_PERSONAL_RECOMMENDATIONS:-false}
      FEATURE_PROMOTIONS_BETA: ${FEATURE_PROMOTIONS_BETA:-false}
    ports:
      - "8080:80"
    command: sh -lc 'install -d -o www-data -g www-data -m 0750 "$${UPLOAD_STORAGE_PATH}" && apache2-foreground'
    volumes:
      - ./backend:/var/www/html
      - gymtrack_uploads:/var/lib/gymtrack
    depends_on:
      - db
    networks:
      - gymtrack_net

  # ── Frontend Vue 3 / Vite ───────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: gymtrack_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_TURNSTILE_ENABLED: ${VITE_TURNSTILE_ENABLED:-false}
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - gymtrack_net

volumes:
  db_data:
  frontend_node_modules:
  gymtrack_uploads:

networks:
  gymtrack_net:
    driver: bridge
