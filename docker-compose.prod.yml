# Entorno endurecido de producción con healthchecks, secretos externos,
# almacenamiento persistente y contenedores de aplicación de sólo lectura.
x-backend-environment: &backend-environment
  APP_ENV: production
  APP_KEY: ${APP_KEY:?Definí APP_KEY con un secreto aleatorio de al menos 32 caracteres}
  FRONTEND_URL: ${FRONTEND_URL:?Definí la URL HTTPS pública del frontend}
  APP_URL: ${APP_URL:?Definí la URL HTTPS pública de la aplicación}
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-gymtrack}
  DB_USERNAME: ${DB_USERNAME:-gymtrack_user}
  DB_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD}
  SESSION_NAME: ${SESSION_NAME:-gymtrack_session}
  SESSION_SECURE: "true"
  SESSION_PATH: /
  SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-1800}
  SESSION_ABSOLUTE_SECONDS: ${SESSION_ABSOLUTE_SECONDS:-28800}
  TRUST_PROXY_HEADERS: "true"
  TURNSTILE_ENABLED: "true"
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?Definí TURNSTILE_SECRET_KEY}
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?Definí TURNSTILE_SITE_KEY}
  MAIL_TRANSPORT: mail
  MAIL_FROM: ${MAIL_FROM:?Definí MAIL_FROM con un correo válido}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-GymTrack}
  EMAIL_VERIFICATION_TTL_SECONDS: ${EMAIL_VERIFICATION_TTL_SECONDS:-86400}
  PAYMENT_PROVIDER: mercado_pago
  PAYMENT_MODE: ${PAYMENT_MODE:-test}
  MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:?Definí MERCADO_PAGO_ACCESS_TOKEN}
  MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:?Definí MERCADO_PAGO_WEBHOOK_SECRET}
  UPLOAD_STORAGE_PATH: /var/lib/gymtrack/uploads
  SEED_DEMO_DATA: "false"
  ALLOW_DEMO_DATA_IN_PRODUCTION: "false"
  FEATURE_WHATSAPP: "false"
  FEATURE_GOOGLE_CALENDAR_SYNC: "false"
  FEATURE_ADVANCED_ANALYTICS: "false"
  FEATURE_PERSONAL_RECOMMENDATIONS: "false"
  GEOCODING_ENABLED: ${GEOCODING_ENABLED:-true}
  GEOCODING_PROVIDER_URL: ${GEOCODING_PROVIDER_URL:-https://nominatim.openstreetmap.org/search}
  GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:?Definí GEOCODING_USER_AGENT con un contacto real}
  GEOCODING_CACHE_DAYS: ${GEOCODING_CACHE_DAYS:-30}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-backend-service: &backend-service
  build:
    context: ./backend
    dockerfile: Dockerfile.prod
    args:
      APP_REVISION: ${APP_REVISION:-unknown}
  restart: unless-stopped
  environment: *backend-environment
  secrets:
    - smtp_config
  volumes:
    - gymtrack_uploads:/var/lib/gymtrack
    - backend_sessions:/var/lib/php/sessions
  depends_on:
    db:
      condition: service_healthy
    schema-check:
      condition: service_completed_successfully
  networks:
    - gymtrack_net
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
    - /var/run/apache2:size=2m,mode=0755
    - /var/lock/apache2:size=2m,mode=0755

services:
  db:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definí MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-gymtrack}
      MYSQL_USER: ${DB_USERNAME:-gymtrack_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - db_data:/var/lib/mysql
      - ./database/gymtrack_database.sql:/docker-entrypoint-initdb.d/000_bootstrap.sql:ro
      - ./database/migrations/001_phase1_integrity.sql:/docker-entrypoint-initdb.d/001_phase1_integrity.sql:ro
      - ./database/migrations/002_phase3_roles_demo_context.sql:/docker-entrypoint-initdb.d/002_phase3_roles_demo_context.sql:ro
      - ./database/migrations/003_phase3_identity_security.sql:/docker-entrypoint-initdb.d/003_phase3_identity_security.sql:ro
      - ./database/migrations/004_phase4_administration.sql:/docker-entrypoint-initdb.d/004_phase4_administration.sql:ro
      - ./database/migrations/005_phase5_tenant_operations.sql:/docker-entrypoint-initdb.d/005_phase5_tenant_operations.sql:ro
      - ./database/migrations/006_class_schedule_booking_attendance.sql:/docker-entrypoint-initdb.d/006_class_schedule_booking_attendance.sql:ro
      - ./database/migrations/007_payments_finance_reports.sql:/docker-entrypoint-initdb.d/007_payments_finance_reports.sql:ro
      - ./database/migrations/008_phase9_calendar_promotions_notifications.sql:/docker-entrypoint-initdb.d/008_phase9_calendar_promotions_notifications.sql:ro
      - ./database/migrations/009_phase10_member_experience.sql:/docker-entrypoint-initdb.d/009_phase10_member_experience.sql:ro
      - ./database/migrations/010_gimnasios_mapa_sincronizado.sql:/docker-entrypoint-initdb.d/010_gimnasios_mapa_sincronizado.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - gymtrack_net
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  schema-check:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: "no"
    environment:
      MYSQL_PWD: ${DB_PASSWORD:?Definí DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-gymtrack}
      DB_USERNAME: ${DB_USERNAME:-gymtrack_user}
    command:
      - sh
      - -ec
      - |
        for version in
          000_bootstrap
          001_phase1_integrity
          002_phase3_roles_demo_context
          003_phase3_identity_security
          004_phase4_administration
          005_phase5_tenant_operations
          006_class_schedule_booking_attendance
          007_payments_finance_reports
          008_phase9_calendar_promotions_notifications
          009_phase10_member_experience
          010_gimnasios_mapa_sincronizado
        do
          applied=$$(mysql --host=db --user="$${DB_USERNAME}" --database="$${DB_DATABASE}" --batch --skip-column-names --execute="SELECT COUNT(*) FROM schema_migrations WHERE version='$${version}'")
          if [ "$${applied}" != 1 ]; then
            echo "Falta la migración requerida: $${version}" >&2
            exit 1
          fi
        done
        echo 'Esquema de base de datos actualizado.'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gymtrack_net
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backend:
    <<: *backend-service
    command: >-
      sh -ec 'test -s /run/secrets/smtp_config;
      install -d -o www-data -g www-data -m 0750 "$${UPLOAD_STORAGE_PATH}";
      exec apache2-foreground'
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/api/system/context') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-worker:
    <<: *backend-service
    command: >-
      sh -ec 'while true; do php console.php notifications:dispatch 100; sleep 15; done'

  maintenance-worker:
    <<: *backend-service
    command: >-
      sh -ec 'while true; do php console.php auth:cleanup; sleep 21600; done'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        TURNSTILE_PUBLIC_SITE_ID: ${TURNSTILE_SITE_KEY:?Definí TURNSTILE_SITE_KEY}
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gymtrack_net
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=8m,mode=1777

secrets:
  smtp_config:
    file: ${SMTP_CONFIG_FILE:?Definí SMTP_CONFIG_FILE con la ruta al archivo msmtp}

volumes:
  db_data:
  gymtrack_uploads:
  backend_sessions:

networks:
  gymtrack_net:
    driver: bridge
