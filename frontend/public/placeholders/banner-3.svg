<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Imagen de relleno de gimnasio 3</title><desc id="desc">Ilustración abstracta de entrenamiento para gimnasios que todavía no subieron su banner.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1319"/><stop offset="1" stop-color="#121e27"/></linearGradient>
    <radialGradient id="luz" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#9ccc3c" stop-opacity=".28"/><stop offset="1" stop-color="#9ccc3c" stop-opacity="0"/></radialGradient>
    <pattern id="rayas" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><rect width="2" height="28" fill="#fff" fill-opacity=".035"/></pattern>
  </defs>
  <rect width="800" height="500" fill="url(#fondo)"/><rect width="800" height="500" fill="url(#rayas)"/>
  <circle cx="560" cy="262" r="240" fill="url(#luz)"/>
  <g transform="translate(560 262) scale(0.527)" fill="#9ccc3c" stroke="#9ccc3c"><line x1="-140" y1="-170" x2="140" y2="-170" stroke-width="16" stroke-linecap="round" stroke-opacity=".45"/><line x1="-95" y1="-170" x2="-95" y2="10" stroke-width="12" stroke-opacity=".55"/><line x1="95" y1="-170" x2="95" y2="10" stroke-width="12" stroke-opacity=".55"/><circle cx="-95" cy="80" r="70" fill="none" stroke-width="20" stroke-opacity=".92"/><circle cx="95" cy="80" r="70" fill="none" stroke-width="20" stroke-opacity=".92"/></g>
</svg>
