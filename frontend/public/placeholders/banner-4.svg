<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Imagen de relleno de gimnasio 4</title><desc id="desc">Ilustración abstracta de entrenamiento para gimnasios que todavía no subieron su banner.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1319"/><stop offset="1" stop-color="#121e27"/></linearGradient>
    <radialGradient id="luz" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e6b83c" stop-opacity=".28"/><stop offset="1" stop-color="#e6b83c" stop-opacity="0"/></radialGradient>
    <pattern id="rayas" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><rect width="2" height="28" fill="#fff" fill-opacity=".035"/></pattern>
  </defs>
  <rect width="800" height="500" fill="url(#fondo)"/><rect width="800" height="500" fill="url(#rayas)"/>
  <circle cx="560" cy="250" r="240" fill="url(#luz)"/>
  <g transform="translate(560 250) scale(0.612)" fill="#e6b83c" stroke="#e6b83c"><rect x="-210" y="70" width="56" height="70" rx="10" fill-opacity="0.45" stroke="none"/><rect x="-130" y="20" width="56" height="120" rx="10" fill-opacity="0.58" stroke="none"/><rect x="-50" y="-30" width="56" height="170" rx="10" fill-opacity="0.72" stroke="none"/><rect x="30" y="-90" width="56" height="230" rx="10" fill-opacity="0.86" stroke="none"/><rect x="110" y="-150" width="56" height="290" rx="10" fill-opacity="0.98" stroke="none"/></g>
</svg>
