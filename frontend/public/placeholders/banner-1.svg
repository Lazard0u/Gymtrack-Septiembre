<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Imagen de relleno de gimnasio 1</title><desc id="desc">Ilustración abstracta de entrenamiento para gimnasios que todavía no subieron su banner.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1319"/><stop offset="1" stop-color="#121e27"/></linearGradient>
    <radialGradient id="luz" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e8685a" stop-opacity=".28"/><stop offset="1" stop-color="#e8685a" stop-opacity="0"/></radialGradient>
    <pattern id="rayas" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><rect width="2" height="28" fill="#fff" fill-opacity=".035"/></pattern>
  </defs>
  <rect width="800" height="500" fill="url(#fondo)"/><rect width="800" height="500" fill="url(#rayas)"/>
  <circle cx="560" cy="250" r="240" fill="url(#luz)"/>
